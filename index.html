<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>麺屋ひなた</title>
<meta name="description" content="3Dラーメン店シミュレーター — 調理・接客・会計・仕入れ・スタッフ雇用・店舗拡張">
<meta name="theme-color" content="#15100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麺屋ひなた">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<style>
/* v2: 2F zashiki, detailed world, 7 staff roles
   VOICE a lived-in neighbourhood ramen shop at night: warm, busy, tactile, a little playful
   IDEA a real 町中華/ramen-ya floor plan: open kitchen at the back, counter and tables in front, register by the door, office PC in the corner
   PICTURE the whole 3D shop seen from above-front, following the chef as they walk between stations
   COLOUR charcoal night #15100c, warm wood, lantern red #c8102e, amber #f2a541, cream #f6ead7, steel greys
   TYPE Dela Gothic One for signage + Zen Kaku Gothic New + Noto Sans Myanmar
   LAYOUT full-screen 3D; HUD top, tickets under it, joystick bottom-left, action button bottom-right; panels are wooden sheets */
:root{--ink:#f6ead7;--mute:#c9b79e;--bg:#15100c;--red:#c8102e;--amber:#f2a541;--gold:#f2d27a;--ok:#5fd18b;--bad:#ff6b5b;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Zen Kaku Gothic New","Noto Sans Myanmar",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
.my{font-family:"Noto Sans Myanmar","Zen Kaku Gothic New",sans-serif;line-height:1.85}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);background:#1d140de0;border:1px solid #ffffff22;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:900;white-space:nowrap;color:var(--ink)}
.lb.w{background:#c8102ee6;border-color:#ff9a9a}
.bub{position:absolute;transform:translate(-50%,-100%);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:900;font-size:12px;color:#2a1a0f;box-shadow:0 3px 10px #0008}
.bub span{width:26px;height:26px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-size:11px;line-height:1}
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#000b,#0000);z-index:3;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;background:#1d140dd9;border:1px solid #ffffff22;border-radius:999px;padding:4px 11px;font-weight:900;white-space:nowrap;min-height:34px}
.chip b{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:var(--gold);font-size:16px;font-variant-numeric:tabular-nums}
#stars{color:var(--amber)}
.sp{flex:1}
#openBtn{background:var(--red);border-color:#ff8a8a}
#openBtn[hidden]{display:none}
#tickets{position:absolute;left:8px;right:8px;top:calc(56px + env(safe-area-inset-top));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:3;pointer-events:none}
.tk{flex:none;background:var(--ink);color:#2a1a0f;border-radius:6px;padding:4px 7px 6px;min-width:96px;box-shadow:0 3px 0 #0006;font-size:11px;line-height:1.35}
.tk b{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.tk b em{font-style:normal;background:#2a1a0f;color:var(--ink);border-radius:4px;padding:0 5px;font-family:"Dela Gothic One",sans-serif;font-weight:400}
.tk i{display:block;font-style:normal}
.tk i.d{color:#2f9e5c;text-decoration:line-through}
.tk u{display:block;height:3px;background:#0002;margin-top:3px;text-decoration:none}
.tk u s{display:block;height:100%;background:#2f9e5c;text-decoration:none}
#hand{position:absolute;left:10px;top:calc(120px + env(safe-area-inset-top));z-index:3;background:#1d140de0;border:1px solid #ffffff22;border-radius:10px;padding:4px 10px;font-weight:900;font-size:12px}
#hand[hidden]{display:none}
#joy{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff2a;z-index:3;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#f6ead7cc;box-shadow:0 4px 12px #0008}
#act{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:128px;min-height:128px;border-radius:50%;border:0;background:var(--red);box-shadow:0 6px 0 #7a0a1c,0 10px 30px #000a;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px;text-align:center}
#act b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:17px;line-height:1.15}
#act small{font-size:10px;opacity:.85;line-height:1.2}
#act[disabled]{background:#3a2a20;box-shadow:0 6px 0 #1a120c;opacity:.85}
#act:active:not([disabled]){transform:translateY(3px);box-shadow:0 3px 0 #7a0a1c}
#act .pr{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),#0000 0);z-index:-1}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5;background:#1d140de6;border:1px solid #ffffff2a;border-radius:12px;padding:8px 16px;font-weight:900;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;max-width:86vw}
#toast.on{opacity:1}
#modal{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#0d0906cc;padding:12px;overflow:auto}
#modal[hidden]{display:none}
.card{width:min(520px,100%);max-height:calc(100vh - 24px);overflow:auto;background:linear-gradient(#3a2616,#24170d);border:1px solid #ffffff1f;border-radius:16px;padding:18px 16px;box-shadow:0 20px 60px #000c}
.card h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.05;margin:0 0 6px}
.card h1 em{font-style:normal;color:var(--red);text-shadow:0 0 18px #c8102e88}
.card h2{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:24px;margin:0 0 8px}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--gold)}
.card p{margin:0 0 10px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-height:40px;border-radius:10px;border:1px solid #ffffff22;background:#0003;font-weight:900}
.tabs button[aria-pressed=true]{background:var(--amber);color:#2a1a0f}
.list{display:grid;gap:6px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:#0003;border:1px solid #ffffff14;border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.it b{font-size:14px}
.it small{grid-column:1;color:var(--mute);font-size:11px}
.it em{grid-row:1/3;grid-column:2;font-style:normal;font-family:"Dela Gothic One",sans-serif;color:var(--gold);white-space:nowrap;font-size:14px}
.it[disabled]{opacity:.4}
.bar{height:6px;background:#0004;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok)}
.big{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--red);font-family:"Dela Gothic One",sans-serif;font-size:19px;letter-spacing:.05em;box-shadow:0 4px 0 #7a0a1c;margin-top:12px}
.ghost{width:100%;min-height:44px;border-radius:12px;border:1px solid #ffffff33;background:none;font-weight:900;margin-top:8px}
.steps{margin:0 0 6px;padding:0;list-style:none;display:grid;gap:7px}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:9px;align-items:start}
.steps b{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:13px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0 4px}
.stat div{background:#0003;border-radius:10px;padding:7px 10px}
.stat span{display:block;font-size:11px;color:var(--mute)}
.stat b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:18px;color:var(--gold)}
.stat b.neg{color:var(--bad)}
#floorChip{background:#1f3a5fe6;border-color:#7fb0ff}
#floorChip.w{background:#c8102ee6;border-color:#ff9a9a}
#floorChip[hidden]{display:none}
.tk.up{background:#dfe9ff}
.ghost.sm{min-height:34px;margin:0 0 4px;font-size:12px}
.card .bar{display:block}
#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#f6ead7;box-shadow:0 0 0 2px #0008;z-index:2;pointer-events:none}
#cross[hidden]{display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);z-index:1}
@media(min-width:900px){#joy{display:none}}
</style>
</head>
<body>
<div id="app">
<div id="loading" class="my">ဆိုင်ကို ပြင်ဆင်နေပါတယ်…</div>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud">
<div class="chip">¥ <b id="money">0</b></div>
<div class="chip"><span id="day">1日目</span> <b id="clock" style="font-size:14px">準備中</b></div>
<div class="chip" id="stars">★★★☆☆</div>
<span class="sp"></span>
<button class="chip" id="openBtn">開店する</button>
<div class="chip" id="floorChip" hidden></div>
<button class="chip" id="viewBtn">👁 1人称</button>
<button class="chip" id="menuBtn" aria-label="メニュー">☰</button>
</div>
<div id="tickets"></div>
<div id="hand" hidden></div>
<div id="joy"><i></i></div>
<button id="act" disabled><span class="pr"></span><b id="actT">—</b><small id="actS" class="my"></small></button>
<div id="toast"></div>
<div id="cross" hidden></div>
<div id="modal" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE){document.getElementById('loading').textContent='3D engine ကို load မရပါ။ Internet ချိတ်ပြီး ပြန်ဖွင့်ပါ။'}</script>
<script src="world.js"></script>
<script src="build.js"></script>
<script src="game.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claudeusercontent|claude\.ai/.test(location.host))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
